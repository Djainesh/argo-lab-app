apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod
  namespace: argocd
spec:
  description: Production environments
  sourceRepos:
    - https://github.com/Djainesh/argo-lab-app.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: webapp-prod
    - server: https://kubernetes.default.svc
      namespace: webapp-helm-prod
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ''
      kind: Service
