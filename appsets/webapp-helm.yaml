apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: webapp-helm
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            project: nonprod
          - env: staging
            project: nonprod
          - env: prod
            project: prod
  template:
    metadata:
      name: 'webapp-helm-{{env}}'
    spec:
      project: '{{project}}'
      source:
        repoURL: https://github.com/Djainesh/argo-lab-app.git
        targetRevision: main
        path: charts/webapp
        helm:
          valueFiles:
            - values.yaml
            - 'values-{{env}}.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'webapp-helm-{{env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
